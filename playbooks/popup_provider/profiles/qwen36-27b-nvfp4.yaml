# Qwen3.6 27B NVFP4 — launch profile
#
# Fits on one H100 80GB (ModelOpt NVFP4 ~14GB weights + KV cache headroom).
# Used on Alliance clusters (FIR/Nibi) and Arbutus.
#
# Two variants:
# - Standard: enables Qwen thinking output (reasoning fields)
# - Copilot: disables thinking for OpenAI-compatible clients

model_id: "nvidia/Qwen3.6-27B-NVFP4"
served_model_name: "qwen3.6-27b-nvfp4"
tokenizer: ""
quantization: ""
load_format: ""
dtype: ""
kv_cache_dtype: "bfloat16"
max_model_len: 262144
gpu_memory_utilization: 0.50
max_num_seqs: 8
max_num_batched_tokens: 8192
generation_config: "vllm"
attention_backend: "FLASH_ATTN"
linear_backend: "marlin"
moe_backend: ""
gdn_prefill_backend: "triton"
mm_encoder_attn_backend: "FLASH_ATTN"
speculative_config: '{"method":"mtp","num_speculative_tokens":1}'
trust_remote_code: true
enable_prefix_caching: true
enable_chunked_prefill: true
async_scheduling: true
sleep_when_idle: true
log_stats_interval: 1
enable_auto_tool_choice: true
tool_call_parser: "qwen3_xml"
reasoning_parser: "qwen3"
language_model_only: false
default_chat_template_kwargs: ""
hf_token_env: "HF_TOKEN"