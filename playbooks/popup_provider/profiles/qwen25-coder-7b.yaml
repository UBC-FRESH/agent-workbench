# Qwen2.5 Coder 7B Instruct — launch profile
#
# Fits on a single V100 32GB (fp16 ~16GB weights + KV cache headroom).
# Used as the Sockeye provider model (P124).
#
# For Ollama-based deployments (quantized GGUF), use the Ollama runtime
# instead of vLLM. This profile is for vLLM-native safetensors checkpoints.

model_id: "bartowski/Qwen2.5-Coder-7B-Instruct-GGUF"
served_model_name: "qwen2.5-coder-7b-instruct"
tokenizer: ""
quantization: "gguf"
load_format: "gguf"
dtype: ""
kv_cache_dtype: ""
max_model_len: 32768
gpu_memory_utilization: 0.88
max_num_seqs: 16
max_num_batched_tokens: 8192
generation_config: ""
attention_backend: ""
linear_backend: ""
moe_backend: ""
gdn_prefill_backend: ""
mm_encoder_attn_backend: ""
speculative_config: ""
trust_remote_code: true
enable_prefix_caching: true
enable_chunked_prefill: true
async_scheduling: true
sleep_when_idle: false
log_stats_interval: 10
enable_auto_tool_choice: true
tool_call_parser: "hermes"
reasoning_parser: ""
language_model_only: false
default_chat_template_kwargs: ""
hf_token_env: ""

# Notes:
# - This model is available as a GGUF from bartowski on Hugging Face.
# - vLLM loads GGUF via --load-format gguf --quantization gguf.
# - For the Ollama variant (hf.co/bartowski/Qwen2.5-Coder-7B-Instruct-GGUF:Q4_K_M),
#   use the Ollama runtime, not vLLM.